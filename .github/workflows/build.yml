name: Build CodeNest APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Remove Google Secrets plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          def remove_block(text, name):
              pattern = re.compile(
                  rf'(?ms)^[ \t]*{re.escape(name)}[ \t]*\{{.*?^[ \t]*\}}[ \t]*$'
              )
              return pattern.sub("", text)

          for path in root.rglob("*.gradle.kts"):
              text = path.read_text()

              text = re.sub(
                  r'(?m)^[ \t]*alias\(libs\.plugins\.secrets\)[ \t]*\r?\n?',
                  '',
                  text
              )

              text = re.sub(
                  r'(?m)^[ \t]*id\(["\']com\.google\.android\.secrets["\'][^\r\n]*\r?\n?',
                  '',
                  text
              )

              text = remove_block(text, "secrets")
              text = remove_block(text, "googleSecrets")

              path.write_text(text)

          for path in root.rglob("*.gradle"):
              text = path.read_text()

              text = re.sub(
                  r'(?m)^[ \t]*apply[ \t]+plugin:[ \t]*["\']com\.google\.android\.secrets["\'][^\r\n]*\r?\n?',
                  '',
                  text
              )

              text = remove_block(text, "secrets")
              text = remove_block(text, "googleSecrets")

              path.write_text(text)

          toml = root / "gradle" / "libs.versions.toml"

          if toml.exists():
              text = toml.read_text()

              text = re.sub(
                  r'(?m)^[ \t]*secrets[ \t]*=[^\r\n]*\r?\n?',
                  '',
                  text
              )

              toml.write_text(text)
          PY

      - name: Check remaining Secrets configuration
        run: |
          if grep -RniE \
            'alias\(libs\.plugins\.secrets\)|google\.devtools\.secrets|com\.google\.android\.secrets|^[[:space:]]*secrets[[:space:]]*\{' \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            .; then
            echo "Google Secrets configuration masih ditemukan."
            exit 1
          fi

          echo "Tidak ada konfigurasi Google Secrets."

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeNest-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30