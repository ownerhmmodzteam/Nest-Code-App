name: Build CodeNest APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Remove Google Secrets configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          def remove_block(text, name):
              pattern = re.compile(
                  rf'(?ms)^[ \t]*{re.escape(name)}[ \t]*\{{.*?^[ \t]*\}}[ \t]*'
              )
              return pattern.sub("", text)

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts", ".toml"):
                  continue

              try:
                  text = path.read_text()
              except:
                  continue

              text = re.sub(
                  r'(?m)^[ \t]*alias\(libs\.plugins\.secrets\)[ \t]*\r?\n?',
                  '',
                  text
              )

              text = re.sub(
                  r'(?m)^.*com\.google\.android\.secrets.*\r?\n?',
                  '',
                  text
              )

              text = re.sub(
                  r'(?m)^.*google\.devtools\.secrets.*\r?\n?',
                  '',
                  text
              )

              text = remove_block(text, "secrets")
              text = remove_block(text, "googleSecrets")

              path.write_text(text)

          toml = root / "gradle" / "libs.versions.toml"

          if toml.exists():
              text = toml.read_text()
              text = re.sub(
                  r'(?m)^[ \t]*secrets[ \t]*=.*\r?\n?',
                  '',
                  text
              )
              toml.write_text(text)
          PY

      - name: Verify Secrets removed
        run: |
          if grep -RniE \
            'alias\(libs\.plugins\.secrets\)|google\.devtools\.secrets|com\.google\.android\.secrets|^[[:space:]]*secrets[[:space:]]*\{' \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            .; then
            echo "Secrets configuration masih ditemukan."
            exit 1
          fi

          echo "Secrets configuration bersih."

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeNest-debug
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
