name: Build CodeNest APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Remove Google Secrets configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in (".gradle", ".kts", ".toml"):
                  continue

              try:
                  text = path.read_text()
              except:
                  continue

              text = re.sub(
                  r'(?m)^[ \t]*alias\(libs\.plugins\.secrets\).*?\n',
                  '',
                  text
              )

              text = re.sub(
                  r'(?ms)^[ \t]*secrets[ \t]*\{.*?^[ \t]*\}',
                  '',
                  text
              )

              text = re.sub(
                  r'(?m)^.*com\.google\.android\.secrets.*\n?',
                  '',
                  text
              )

              text = re.sub(
                  r'(?m)^.*google\.devtools\.secrets.*\n?',
                  '',
                  text
              )

              path.write_text(text)
          PY

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeNest-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
